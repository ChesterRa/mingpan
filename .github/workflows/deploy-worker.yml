name: Deploy Worker

# 远程 MCP（Cloudflare Workers）部署：发布 tag 时随 npm 发布一同更新线上端点
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          # wrangler.toml：name=mingpan-mcp，main=src/worker.ts（需 wrangler v4）
