name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write   # Trusted Publishing (OIDC)：npm 无 token 发布所需

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing 要求 npm >= 11.5.1 / Node >= 22.14
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # OIDC 自动认证（无需任何 npm token；公共仓库自动附带 provenance 证明）
      - name: Publish
        run: npm publish --access public
