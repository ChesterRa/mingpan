name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # 可复现性承诺：同一输入在任意宿主时区下输出必须一致
      - name: Test (TZ matrix)
        run: |
          for tz in Asia/Shanghai UTC America/New_York; do
            echo "::group::Tests with TZ=$tz"
            TZ=$tz npm test || exit 1
            echo "::endgroup::"
          done
