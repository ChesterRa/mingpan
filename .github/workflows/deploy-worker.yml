name: Deploy Worker

# 远程 MCP（Cloudflare Workers）部署：发布 tag 时随 npm 发布一同更新线上端点
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 生产只有一个正式 Worker；不同 tag 也必须串行，避免旧部署覆盖新部署。
  group: mingpan-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run verify:release-version

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test packaged stdio entry
        run: npm run smoke:stdio

      - name: Validate Worker bundle
        run: npm run deploy:worker:dry-run

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.1"

      - name: Smoke test deployed Worker
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          OFFICIAL_URL: https://mingpan.bzwai.com
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"

          wait_for_release() {
            local base_url="${1%/}"
            local health_url="${base_url}/healthz"
            local health_json
            for attempt in $(seq 1 24); do
              health_json="$(curl --fail --silent --show-error "$health_url" || true)"
              if HEALTH_JSON="$health_json" EXPECTED_VERSION="$EXPECTED_VERSION" node -e '
                try {
                  const health = JSON.parse(process.env.HEALTH_JSON ?? "");
                  const ready = health.status === "ok"
                    && health.service === "mingpan"
                    && health.version === process.env.EXPECTED_VERSION
                    && health.protocol === "2026-07-28";
                  process.exit(ready ? 0 : 1);
                } catch {
                  process.exit(1);
                }
              '; then
                echo "Release ${EXPECTED_VERSION} is ready at ${base_url}"
                return 0
              fi
              echo "Waiting for release ${EXPECTED_VERSION} at ${health_url} ($attempt/24)"
              sleep 5
            done
            echo "Timed out waiting for release ${EXPECTED_VERSION} at ${health_url}" >&2
            return 1
          }

          smoke_remote() {
            local endpoint="${1%/}/mcp"
            for attempt in $(seq 1 6); do
              echo "Testing MCP endpoint ${endpoint} ($attempt/6)"
              if MCP_ENDPOINT="$endpoint" npm run smoke:remote; then
                return 0
              fi
              if [ "$attempt" -lt 6 ]; then
                echo "MCP endpoint is not ready yet; retrying in 5 seconds"
                sleep 5
              fi
            done
            echo "MCP smoke failed after 6 attempts: ${endpoint}" >&2
            return 1
          }

          wait_for_release "$DEPLOYMENT_URL"
          smoke_remote "$DEPLOYMENT_URL"

          wait_for_release "$OFFICIAL_URL"
          curl --fail --silent --show-error --output /dev/null "${OFFICIAL_URL%/}/"
          smoke_remote "$OFFICIAL_URL"
